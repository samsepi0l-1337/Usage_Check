name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Guard: reports whether the embedded license Ed25519 public key
  # (`src-tauri/src/license/pubkey.rs::EMBEDDED_PUBLIC_KEY_B64`) is still the
  # placeholder. Mechanism: `embedded_public_key_is_not_placeholder` is a
  # `#[ignore]`d unit test in `src-tauri/src/license/pubkey_tests.rs` —
  # ignored so the normal `cargo test -p usage-app` suite stays green before
  # the real key is embedded — and this step runs it EXPLICITLY via
  # `--ignored`.
  #
  # ADVISORY, NOT BLOCKING (operator decision, 2026-07-30). It used to fail
  # the whole workflow while the placeholder was in place. Releases are now
  # deliberately shipped Free-only until the real autoworkit.com production
  # key exists, so the check `continue-on-error`s and instead emits a loud
  # workflow warning + job-summary line. Consequence of releasing while it
  # warns: `resolve_public_key` returns `None` in a release build, every
  # license token fails verification, and the shipped binary is permanently
  # Free — no customer key can unlock Pro. Codex/Claude/agy are unaffected.
  #
  # To ship a Pro-capable build: embed the real production Ed25519 public key
  # in `EMBEDDED_PUBLIC_KEY_B64` (see `docs/LICENSE_API.md` for how the site
  # generates and publishes it) and rewrite the sibling test
  # `embedded_constant_is_the_documented_placeholder`, which pins today's
  # placeholder state. The guard then passes with no workflow change; to make
  # it block again afterwards, drop the `continue-on-error` line below.
  guard:
    name: Guard - embedded license public key (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Guard - embedded license public key is not the placeholder
        id: pubkey
        continue-on-error: true
        run: cargo test -p usage-app -- embedded_public_key_is_not_placeholder --ignored

      - name: Report - placeholder key still embedded
        if: steps.pubkey.outcome == 'failure'
        run: |
          echo "::warning title=License public key is still the placeholder::This release ships permanently Free - every license token fails verification, so no customer key can unlock Pro. Codex/Claude/agy are unaffected. Embed the real autoworkit.com production Ed25519 public key in src-tauri/src/license/pubkey.rs to ship a Pro-capable build."
          {
            echo "### :warning: License public key is still the placeholder"
            echo
            echo "\`EMBEDDED_PUBLIC_KEY_B64\` (\`src-tauri/src/license/pubkey.rs\`) has not been"
            echo "replaced with the real autoworkit.com production key."
            echo
            echo "**This release is permanently Free.** \`resolve_public_key\` returns \`None\` in a"
            echo "release build, so every license token fails verification and no customer key can"
            echo "unlock Pro. Codex / Claude / agy are unaffected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report - real license public key embedded
        if: steps.pubkey.outcome == 'success'
        run: |
          echo "Embedded license public key is a valid, non-placeholder Ed25519 key - Pro activation can work in this build." \
            >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin macOS 15 so the runner image does not silently jump to macOS 26
          # when the macos-latest label migrates.
          - platform: macos-15
            args: --bundles dmg,app
            artifact: macos
          - platform: windows-latest
            args: --bundles nsis,msi
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Ensure frontend dist exists
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Single unified build — no more free/pro edition split (Pro providers
      # are unlocked at runtime by a license key, not by a separate binary).
      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri build --features custom-protocol ${{ matrix.args }}

      - name: Collect bundle paths
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          # Cargo workspace puts release output at repo-root target/, not src-tauri/target/.
          ROOT_BUNDLE="target/release/bundle"
          NESTED_BUNDLE="src-tauri/target/release/bundle"
          if [ -d "$ROOT_BUNDLE" ]; then
            echo "dir=$ROOT_BUNDLE" >> "$GITHUB_OUTPUT"
          elif [ -d "$NESTED_BUNDLE" ]; then
            echo "dir=$NESTED_BUNDLE" >> "$GITHUB_OUTPUT"
          else
            echo "No bundle directory found" >&2
            find . -path '*/release/bundle/*' -print 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          ls -lah "$(grep '^dir=' "$GITHUB_OUTPUT" | cut -d= -f2)" || true

      # Without an Apple Developer ID, Tauri must still ad-hoc sign the .app bundle
      # (signingIdentity "-"). Linker-only signatures look "damaged" under Gatekeeper.
      - name: Verify macOS ad-hoc code signature
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="${{ steps.bundles.outputs.dir }}"
          APP="$BUNDLE_DIR/macos/UsageCheck.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/usagecheck-codesign.txt
          grep -q 'Signature=adhoc' /tmp/usagecheck-codesign.txt
          grep -q 'Sealed Resources version=2' /tmp/usagecheck-codesign.txt
          # Reject linker-only signatures that Gatekeeper treats as damaged.
          if grep -q 'linker-signed' /tmp/usagecheck-codesign.txt; then
            echo "ERROR: app is still linker-signed only; bundle was not sealed" >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        if: matrix.artifact == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: UsageCheck-macos
          path: |
            ${{ steps.bundles.outputs.dir }}/dmg/*.dmg
            ${{ steps.bundles.outputs.dir }}/macos/*.app
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.artifact == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: UsageCheck-windows
          path: |
            ${{ steps.bundles.outputs.dir }}/nsis/*.exe
            ${{ steps.bundles.outputs.dir }}/msi/*.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Artifacts keep bundle subdirs (dmg/, nsis/, msi/) from upload paths.
          # 3 unified installers: macOS .dmg, Windows .exe (NSIS) + .msi.
          files: |
            dist/UsageCheck-macos/**/*.dmg
            dist/UsageCheck-windows/**/*.exe
            dist/UsageCheck-windows/**/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
